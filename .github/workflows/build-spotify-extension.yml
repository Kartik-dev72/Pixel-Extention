name: Build Spotify extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extension-spotify/**"
      - "extension-api/**"
      - ".github/workflows/build-spotify-extension.yml"
    tags: ["spotify-v*"]

permissions:
  contents: write # only used by the release step below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The runner ships the Android SDK; licenses must be accepted so AGP can fetch compileSdk 37.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :extension-spotify:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: spotify-extension-debug
          path: extension-spotify/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tag a commit "spotify-v1.1.0" to get the APK as a downloadable GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/spotify-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          extension-spotify/build/outputs/apk/debug/*.apk
          --title "Spotify extension ${GITHUB_REF_NAME#spotify-v}"
          --generate-notes
